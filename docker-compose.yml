services:
  mysql:
    image: mysql:8.4
    container_name: ccm-mysql
    environment:
      MYSQL_DATABASE: ccm
      MYSQL_USER: ccm
      MYSQL_PASSWORD: ${CCM_DB_PASSWORD:-ccm_secret}
      MYSQL_ROOT_PASSWORD: ${CCM_DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "3306:3306"
    volumes:
      - ccm_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${CCM_DB_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: ccm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CCM_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${CCM_S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ccm_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${CCM_S3_ACCESS_KEY:-minioadmin} $${CCM_S3_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/$${CCM_S3_BUCKET:-ccm-documents};
      exit 0;
      "
    environment:
      CCM_S3_ACCESS_KEY: ${CCM_S3_ACCESS_KEY:-minioadmin}
      CCM_S3_SECRET_KEY: ${CCM_S3_SECRET_KEY:-minioadmin}
      CCM_S3_BUCKET: ${CCM_S3_BUCKET:-ccm-documents}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ccm-backend
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      CCM_DB_URL: jdbc:mysql://mysql:3306/ccm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      CCM_DB_USER: ccm
      CCM_DB_PASSWORD: ${CCM_DB_PASSWORD:-ccm_secret}
      CCM_JWT_SECRET: ${CCM_JWT_SECRET:-change-me-to-a-long-random-secret-key-at-least-256-bits}
      CCM_S3_ENDPOINT: http://minio:9000
      CCM_S3_ACCESS_KEY: ${CCM_S3_ACCESS_KEY:-minioadmin}
      CCM_S3_SECRET_KEY: ${CCM_S3_SECRET_KEY:-minioadmin}
      CCM_S3_BUCKET: ${CCM_S3_BUCKET:-ccm-documents}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ccm-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  ccm_mysql_data:
  ccm_minio_data:

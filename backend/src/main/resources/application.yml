spring:
  application:
    name: ccm
  datasource:
    url: ${CCM_DB_URL:jdbc:mysql://localhost:3306/ccm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${CCM_DB_USER:ccm}
    password: ${CCM_DB_PASSWORD:ccm_secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: ${CCM_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

ccm:
  security:
    jwt-secret: ${CCM_JWT_SECRET:change-me-to-a-long-random-secret-key-at-least-256-bits}
    access-token-minutes: ${CCM_ACCESS_TOKEN_MINUTES:30}
    refresh-token-days: ${CCM_REFRESH_TOKEN_DAYS:14}
  storage:
    endpoint: ${CCM_S3_ENDPOINT:http://localhost:9000}
    region: ${CCM_S3_REGION:us-east-1}
    access-key: ${CCM_S3_ACCESS_KEY:minioadmin}
    secret-key: ${CCM_S3_SECRET_KEY:minioadmin}
    bucket: ${CCM_S3_BUCKET:ccm-documents}
  currency-default: CNY

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
